<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Newsletter sign up</title>
</head>
<body>
    <div class="container">
        <div class="content">
            <h1>Stay updated!</h1>
            <p class="description">Join 60,000+ product managers receiving monthly updates on:</p>
            
            <div class="features">
                <div class="feature-item">
                    <img src="./Image/icon-list.svg" alt="icon-list">
                    <span>Product discovery and building what matters</span>
                </div>
                <div class="feature-item">
                    <img src="./Image/icon-list.svg" alt="icon-list">
                    <span>Measuring to ensure updates are a success</span>
                </div>
                <div class="feature-item">
                    <img src="./Image/icon-list.svg" alt="icon-list">
                    <span>And much more!</span>
                </div>
            </div>
            
            <form id="form">
                <div class="form-group">
                    <div class="label-container">
                        <label for="email">Email address</label>
                        <div id="error-email" class="error-message">Valid email required</div>
                    </div>
                    <input type="text" name="email" id="email" placeholder="email@company.com">
                </div>
                <button type="submit">Subscribe to monthly newsletter</button>
            </form>
        </div>
        
        <div class="image-container">
            <img src="./Image/illustration-sign-up-desktop.svg" alt="illustration" id="illustration">
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
