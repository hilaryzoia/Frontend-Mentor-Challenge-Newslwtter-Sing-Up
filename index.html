<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">

    <title>Newsletter sign-up</title>
</head>
<body>
    <div class="container">
        <div class="Illustration">
            <img src="./Image/illustration-sign-up-desktop.svg" 
            alt="Illustration">
            <h1>Stay updated!</h1>
        </div>
        <div class="text">
            <p>Join 60.000+ product managers receiving monthly updates on:</p>
        </div>
       <div class="titulos">
        <div class="list">
                <img src="./Image/icon-list.svg" alt="Icone">
                <p>Product discovery and building what matters</p>
            </div>
        </div>
    <div class="titulos-2">
        <div class="list-2">
                <img src="./Image/icon-list.svg" alt="Icone">
                <p>Measuring to ensure updates are a success</p>
            </div>
        </div>
        <div class="titulos-3">
            <div class="list-3">
                    <img src="./Image/icon-list.svg" alt="Icone">
                    <p>And much more!</p>
                </div>     
            </div>
            <form id="form">
                <div class="input-container">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="email@company.com" required>
                <button type="submit"
                id="submit">Subscribe to monthly newsletter</button>  
                <span id="email-error" class="error-message">Valid email required</span>
            </div>
            </form>                        
</div>
<script src="script.js"></script>
</body>
</html>
