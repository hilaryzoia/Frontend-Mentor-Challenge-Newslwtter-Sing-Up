<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/sucess.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Success Page</title>
</head>
<body>
    <div class="success-container">
        <div class="success-content">
            <img src="./assets/images/icon-success.svg" alt="Success icon">
            <h1>Thanks for subscribing!</h1>
            <p>
                A confirmation email has been sent to <strong id="user-email">ash@loremcompany.com</strong>. 
                Please open it and click the button inside to confirm your subscription.
            </p>
            <button onclick="dismissMessage()">Dismiss message</button>
        </div>
    </div>
    <script>
        // Pegar o email da URL
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('user-email').textContent = email;
        }
        
        function dismissMessage() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
